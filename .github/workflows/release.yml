name: Release

permissions: read-all

on:
  push:
    branches: [ main ]

env:
  NEXT_PUBLIC_E2E: 'true'
  E2E_PROD: 'true'
  NEXT_PUBLIC_AUTH_WEB_CLIENT_ID: dummy-client-id
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_PRESENTATION_VIDEO_ID: dQw4w9WgXcQ
  NEXT_PUBLIC_SOCIAL_LINKEDIN: https://linkedin.com/company/arcadeum
  NEXT_PUBLIC_SOCIAL_X: https://x.com/arcadeum
  NEXT_PUBLIC_SOCIAL_INSTAGRAM: https://instagram.com/arcadeum
  NEXT_PUBLIC_SOCIAL_DISCORD: https://discord.gg/arcadeum

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Build
        run: pnpm exec turbo run build --filter web --filter be

      - name: Bundle Build Artifacts
        run: tar -cvf build-artifacts.tar apps/web/.next apps/web/public/build-id.json apps/web/public/game-sizes.json apps/be/dist packages/games-core/dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          path: build-artifacts.tar
          retention-days: 1

  e2e:
    name: E2E (Shard ${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    env:
      MONGODB_OCI_URI: mongodb://localhost:27017/arcadeum_test
      AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'test_jwt_secret_key_for_e2e_only' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Extract Build Artifacts
        run: tar -xvf build-artifacts.tar

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-all-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-all-

      - name: Disable Broken Microsoft Repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.sources
          sudo apt-get update || true

      - name: Install Playwright System Dependencies
        run: pnpm --filter web exec playwright install-deps

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install

      - name: Run E2E Tests
        run: pnpm --filter web test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 30

  merge-e2e-reports:
    name: Merge E2E Reports
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download All Shard Reports
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: all-reports
          merge-multiple: true

      - name: Merge Reports
        run: npx playwright merge-reports all-reports/

      - name: Upload Merged Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-merged-report
          path: all-reports/
          retention-days: 30
