name: Lighthouse Audit

on:
  pull_request:
    branches: [staging, main, develop]

concurrency:
  group: lhci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build (LHCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm turbo run build --filter=web

      - name: Bundle Build Artifacts
        run: tar -cvf lhci-build.tar apps/web/.next apps/web/public/build-id.json apps/web/public/game-sizes.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lhci-build
          path: lhci-build.tar
          retention-days: 1

  audit:
    name: Lighthouse (Shard ${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lhci-build

      - name: Extract Build Artifacts
        run: tar -xvf lhci-build.tar

      - name: Start Next.js server
        run: |
          pnpm --filter web start &
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000/en > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Generate Lighthouse URLs from routes
        run: node apps/web/scripts/generate-lhci-urls.mjs

      - name: Shard URLs
        run: |
          node -e "
            const urls = require('./apps/web/lighthouse-urls.json');
            const shard = ${{ matrix.shard }};
            const total = 4;
            const perShard = Math.ceil(urls.length / total);
            const start = (shard - 1) * perShard;
            const shardUrls = urls.slice(start, start + perShard);
            require('fs').writeFileSync('./apps/web/lighthouse-urls.json', JSON.stringify(shardUrls, null, 2));
            console.log('Shard ' + shard + ': ' + shardUrls.length + ' URLs');
          "

      - name: Run Lighthouse CI
        run: pnpm --filter web lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-shard-${{ matrix.shard }}
          path: .lighthouseci/
          retention-days: 1

  comment:
    name: Post Audit Results
    needs: audit
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-reports-shard-*
          merge-multiple: true
          path: .lighthouseci/

      - name: Post PR comment
        run: node scripts/lhci-comment.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Cleanup
        if: always()
        run: rm -rf .lighthouseci/
